<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Web App Otomasi Gudang</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%230f172a'/><stop offset='100%25' stop-color='%231e293b'/></linearGradient></defs><rect width='32' height='32' rx='6' fill='url(%23bg)'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial, sans-serif' font-weight='900' font-size='20' fill='%2338bdf8'>NM</text></svg>">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
      margin: 0;
      padding: 20px;
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      color: #1a73e8;
      font-size: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    p.desc {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .label-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    label {
      font-weight: 600;
      font-size: 14px;
      color: #334155;
    }
    .row-counter {
      font-size: 12px;
      font-weight: 600;
      color: #0284c7;
      background: #e0f2fe;
      padding: 3px 8px;
      border-radius: 12px;
    }
    textarea {
      width: 100%;
      height: 240px;
      padding: 14px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-family: monospace;
      font-size: 13px;
      box-sizing: border-box;
      resize: vertical;
      background-color: #fafbfc;
      transition: all 0.2s;
    }
    textarea:focus {
      border-color: #1a73e8;
      outline: none;
      background-color: #fff;
      box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.1);
    }
    button {
      background: linear-gradient(135deg, #1a73e8 0%, #1557b0 100%);
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(26, 115, 232,.25);
    }
    button:hover {
      background: linear-gradient(135deg, #1557b0 0%, #0d3c80 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(26, 115, 232,.35);
    }
    button:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    
    /* Spinner Animasi Lucu */
    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #log {
      margin-top: 20px;
      background: #0f172a;
      color: #38bdf8;
      padding: 15px;
      border-radius: 10px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
      max-height: 160px;
      overflow-y: auto;
      display: none;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📦 Web App Otomasi Gudang</h2>
    <p class="desc">Sistem otomatis mendeteksi file admin berdasarkan tanggal hari ini, validasi data Shopee & Tiktok Shop, dan sinkronisasi ke database.</p>
    
    <div class="form-group">
      <div class="label-container">
        <label for="shopeeData">Paste Laporan Unduhan Shopee & Tiktok Shop:</label>
        <span id="rowCounter" class="row-counter">📊 0 baris data</span>
      </div>
      <textarea id="shopeeData" placeholder="Paste data unduhan Shopee & Tiktok Shop di sini tanpa batas baris..."></textarea>
    </div>
    
    <button id="submitBtn" onclick="processData()">
      <div class="spinner" id="btnSpinner"></div>
      <span id="btnText">⚡ Tarik & Proses Data Sekarang</span>
    </button>
    
    <div id="log"></div>
  </div>

  <script>
    // URL WEB APP APPS SCRIPT KAMU
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzFezXPUk7JWy-3xVrOcgEW_E7SmFMjs8MgJv6SO4lHwkghDNeZXx4gB_7zHJP-U2WN/exec";

    const textarea = document.getElementById('shopeeData');
    const rowCounter = document.getElementById('rowCounter');

    // Fitur Penghitung Baris Real-time
    textarea.addEventListener('input', function() {
      let lines = this.value.split('\n').filter(line => line.trim() !== '');
      rowCounter.innerText = `📊 ${lines.toLocaleString()} baris data`;
    });

    function processData() {
      const shopeeData = textarea.value.trim();
      const btn = document.getElementById('submitBtn');
      const btnSpinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');
      const logDiv = document.getElementById('log');
      
      if (!shopeeData) {
        alert('Silakan paste data Shopee & TikTok terlebih dahulu ya! 😊');
        return;
      }
      
      if (WEB_APP_URL.includes("MASUKKAN_URL")) {
        alert('Harap isi URL Web App Apps Script di dalam file index.html terlebih dahulu!');
        return;
      }
      
      // Aktifkan Status Loading / Spinner
      btn.disabled = true;
      btnSpinner.style.display = 'block';
      btnText.innerText = 'Sedang Memproses & Sinkronisasi...';
      
      logDiv.style.display = 'block';
      logDiv.innerText = '[' + new Date().toLocaleTimeString() + '] 🔄 Menghubungkan ke Google Drive & Memproses data...';
      
      fetch(WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ shopeeData: shopeeData })
      })
      .then(response => response.text())
      .then(result => {
        try {
          const res = JSON.parse(result);
          if (res.status === 'success') {
            logDiv.innerText += '\n[' + new Date().toLocaleTimeString() + '] ✔️ ' + res.message;
            logDiv.innerText += '\n[' + new Date().toLocaleTimeString() + '] 🔔 Silakan cek sheet Nota Masuk, Nota Selesai, TRX, dan Laporan.';
            textarea.value = '';
            rowCounter.innerText = '📊 0 baris data'; // Reset counter
          } else {
            logDiv.innerText += '\n[' + new Date().toLocaleTimeString() + '] ❌ Error: ' + res.message;
          }
        } catch(e) {
          logDiv.innerText += '\n[' + new Date().toLocaleTimeString() + '] ❌ Gagal memproses respon server.';
        }
        
        // Kembalikan Tombol seperti semula
        btn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.innerText = '⚡ Tarik & Proses Data Sekarang';
      })
      .catch(error => {
        logDiv.innerText += '\n[' + new Date().toLocaleTimeString() + '] ❌ System Error: ' + error.message;
        
        // Kembalikan Tombol seperti semula
        btn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.innerText = '⚡ Tarik & Proses Data Sekarang';
      });
    }
  </script>
</body>
</html>
